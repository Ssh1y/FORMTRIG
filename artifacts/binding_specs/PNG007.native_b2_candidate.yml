tc_id: 'PNG007'
target:
  project: 'magma/libpng'
  binary: 'libpng_read_fuzzer'
  command: './libpng_read_fuzzer @@'
tc:
  category: 'binary-state-null'
  expression: 'png_ptr->palette == NULL'
atoms:
  - id: 1
    expr: 'png_ptr->palette == NULL'
    kind: 'binary-state-null'
    root: 'png_ptr->palette'
bindings:
  - id: 'palette_image_guard'
    atom: 1
    role: 'guard'
    expr: 'info_ptr->color_type == PNG_COLOR_TYPE_PALETTE'
    observe_at:
      kind: 'cmp'
      function: 'MAGMA_png_read_transform_info'
      file: 'pngrtran.c'
      line: 1947
      inst_no: 10
    component: 'guard_progress'
    priority: 5
    direction: 'higher'
    value_mode: 'outcome'
    observe_window: 'any'
  - id: 'palette_root_observe'
    atom: 1
    role: 'root_observe'
    expr: 'png_ptr->palette == NULL'
    observe_at:
      kind: 'cmp'
      function: 'MAGMA_png_read_transform_info'
      file: 'pngrtran.c'
      line: 1967
      inst_no: 27
    component: 'root_state'
    priority: 10
    direction: 'higher'
    value_mode: 'outcome'
    observe_window: 'any'
  - id: 'palette_opposite_producer_bypassed'
    atom: 1
    role: 'opposite_producer'
    expr: 'png_set_PLTE allocation path absent'
    observe_at:
      kind: 'branch'
      function: 'MAGMA_png_set_PLTE'
      file: 'pngset.c'
      line: 634
      inst_no: 49
    component: 'producer_use'
    priority: 20
    direction: 'higher'
    value_mode: 'absent'
    observe_window: 'any'
  - id: 'palette_use_context'
    atom: 1
    role: 'use'
    expr: 'png_read_transform_info reached palette expansion canary'
    observe_at:
      kind: 'branch'
      function: 'MAGMA_png_read_transform_info'
      file: 'pngrtran.c'
      line: 1967
      inst_no: 45
    component: 'producer_use'
    priority: 30
    direction: 'higher'
    value_mode: 'hit'
    observe_window: 'any'
