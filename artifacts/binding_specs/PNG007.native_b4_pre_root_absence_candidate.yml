tc_id: 'PNG007'
target:
  project: 'magma/libpng'
  binary: 'libpng_read_fuzzer'
  command: './libpng_read_fuzzer @@'
tc:
  category: 'binary-state-null'
  expression: 'png_ptr->palette == NULL'
atoms:
  - id: 1
    expr: 'png_ptr->palette == NULL'
    kind: 'binary-state-null'
