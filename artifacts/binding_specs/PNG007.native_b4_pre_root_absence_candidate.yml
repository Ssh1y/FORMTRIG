      kind: 'branch'
      function: 'MAGMA_png_set_IHDR'
      file: 'pngset.c'
      line: 276
      inst_no: 100
    component: 'guard_progress'
    priority: 4
    direction: 'higher'
    value_mode: 'outcome'
    observe_window: 'pre_reach'
  - id: 'ihdr_color_type_palette_byte_hint'
